name: Revision Diaria de Ofertas

on:
  schedule:
    # Ejecutar todos los días a las 07:00 UTC (08:00 / 09:00 hora peninsular)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  check-offers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar rastreador de ofertas y avisos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Guardar historial de avisos enviados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add avisos_enviados.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar historial de avisos [skip ci]" && git push)
